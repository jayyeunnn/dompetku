<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Wallet body -->
    <rect x="-120" y="-80" width="240" height="160" rx="24" fill="white" opacity="0.95"/>
    <!-- Wallet flap -->
    <path d="M-120,-80 L-120,-40 Q-120,-80 -80,-80 Z" fill="white" opacity="0.7"/>
    <!-- Card slot line -->
    <rect x="60" y="-20" width="60" height="40" rx="12" fill="#0EA5E9" opacity="0.3"/>
    <!-- Coin circle -->
    <circle cx="90" cy="0" r="14" fill="#0EA5E9" opacity="0.6"/>
    <!-- Dollar sign -->
    <text x="0" y="20" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="80" font-weight="800" fill="#0EA5E9" opacity="0.9">₹</text>
  </g>
</svg>