<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  
  <!-- Card 1 (Tilted behind) -->
  <rect x="135" y="135" width="130" height="90" rx="12" fill="#ffffff" fill-opacity="0.7" transform="rotate(-8 200 180)"/>
  
  <!-- Card 2 (Straight behind) -->
  <rect x="205" y="145" width="130" height="90" rx="12" fill="#ffffff"/>
  
  <!-- Main Wallet Body -->
  <rect x="136" y="210" width="240" height="160" rx="22" fill="#ffffff"/>
  
  <!-- Flap with background-gradient stroke for negative space cutout -->
  <rect x="266" y="260" width="110" height="60" rx="14" fill="#ffffff" stroke="url(#bg)" stroke-width="12"/>
  
  <!-- Flap Button/Snap with background-gradient fill -->
  <circle cx="335" cy="290" r="8" fill="url(#bg)"/>
</svg>